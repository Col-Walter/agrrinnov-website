<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agrinnov — L'innovation au cœur de l'agriculture de demain. DiARIS, FARE, Consultation Agritech en Afrique de l'Ouest.">
  <meta name="keywords" content="agrinnov, agritech, agriculture, DiARIS, FARE, sol, formation agricole, Afrique">
  <meta property="og:title" content="Agrinnov — Agritech & Innovation Agricole">
  <meta property="og:description" content="Plateforme d'innovation agricole : analyse de sol (DiARIS), formation entrepreneuriale (FARE), et conseil en acquisition client.">
  <meta property="og:type" content="website">
  <title>Agrinnov — L'Innovation au Cœur de l'Agriculture</title>
  <base href="$FLUTTER_BASE_HREF">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #111111; overflow-x: hidden; }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #111111;
      color: #1FA34A;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .loader-ring {
      width: 60px; height: 60px;
      border: 3px solid rgba(31, 163, 74, 0.2);
      border-top-color: #1FA34A;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .loader-ring-outer {
      width: 80px; height: 80px;
      border: 2px solid rgba(255, 106, 0, 0.3);
      border-bottom-color: #FF6A00;
      border-radius: 50%;
      animation: spin-reverse 1.5s linear infinite;
      position: absolute;
    }
    .loader-wrap { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    #loading p { color: rgba(255,255,255,0.6); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  </style>
  <script>
    window.addEventListener('load', function(ev) {
      var loading = document.getElementById('loading');
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          let appRunner = await engineInitializer.initializeEngine();
          if (loading) loading.style.display = 'none';
          await appRunner.runApp();
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div id="loading">
    <div class="loader-wrap">
      <div class="loader-ring-outer"></div>
      <div class="loader-ring"></div>
    </div>
    <p>Agrinnov</p>
  </div>
</body>
</html>
